<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Lumi | Links</title>

  <meta
    name="description"
    content="Alle offiziellen Links von Lumi: TikTok, Instagram, Threads und mehr."
  >

  <meta name="theme-color" content="#110d11">

  <!-- Простой favicon без отдельного файла -->
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23110d11'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='Arial' font-size='58' fill='%23e7a9b9'%3EL%3C/text%3E%3C/svg%3E"
  >

  <style>
    /* =========================================
       ОСНОВНЫЕ ЦВЕТА

       Позже ты сможешь менять цвета здесь.
       ========================================= */
    :root {
      --background: #0c0a0d;
      --background-soft: #151116;
      --card: rgba(28, 21, 27, 0.86);
      --card-border: rgba(232, 169, 187, 0.15);

      --button: #211820;
      --button-hover: #33202a;
      --button-border: rgba(231, 169, 185, 0.22);

      --accent: #b85d76;
      --accent-light: #e7a9b9;
      --accent-dark: #541d2d;

      --text: #fff7f9;
      --text-soft: #cdbdc3;
      --text-muted: #8f8187;

      --shadow: 0 24px 70px rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--text);
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(118, 35, 58, 0.34),
          transparent 38%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(87, 30, 47, 0.18),
          transparent 32%
        ),
        linear-gradient(
          160deg,
          #09080a 0%,
          #110c10 50%,
          #080709 100%
        );

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 480px;
    }

    .profile-card {
      position: relative;
      overflow: hidden;

      padding: 34px 22px 24px;

      text-align: center;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      box-shadow: var(--shadow);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .profile-card::before {
      content: "";
      position: absolute;
      top: -90px;
      left: 50%;

      width: 250px;
      height: 180px;

      background: rgba(166, 65, 93, 0.16);
      border-radius: 50%;
      filter: blur(55px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .profile-header {
      position: relative;
    }

    .avatar-ring {
      width: 122px;
      height: 122px;
      margin: 0 auto 18px;
      padding: 3px;

      background:
        linear-gradient(
          145deg,
          var(--accent-light),
          var(--accent-dark)
        );

      border-radius: 50%;
      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.44),
        0 0 0 6px rgba(218, 132, 156, 0.04);
    }

    .avatar {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;

      background: var(--background-soft);
      border: 4px solid #171116;
      border-radius: 50%;
    }

    h1 {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(2.35rem, 10vw, 3.25rem);
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .rose {
      color: var(--accent-light);
    }

    .description {
      max-width: 340px;
      margin: 14px auto 0;

      color: var(--text-soft);
      font-size: 1rem;
    }

    .username {
      display: inline-block;
      margin-top: 10px;

      color: var(--accent-light);
      font-size: 0.92rem;
      text-decoration: none;
    }

    .links {
      display: grid;
      gap: 13px;
      margin-top: 28px;
    }

    .social-link {
      min-height: 60px;
      padding: 13px 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      color: var(--text);
      background: var(--button);
      border: 1px solid var(--button-border);
      border-radius: 18px;

      font-size: 1rem;
      font-weight: 650;
      text-align: left;
      text-decoration: none;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.03),
        0 8px 24px rgba(0, 0, 0, 0.16);

      transition:
        transform 180ms ease,
        background-color 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease;
    }

    .social-link:hover {
      background: var(--button-hover);
      border-color: rgba(231, 169, 185, 0.46);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 12px 30px rgba(0, 0, 0, 0.24);

      transform: translateY(-2px);
    }

    .social-link:active {
      transform: scale(0.98);
    }

    .social-link:focus-visible {
      outline: 3px solid var(--accent-light);
      outline-offset: 3px;
    }

    .link-content {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .icon {
      width: 35px;
      height: 35px;
      flex: 0 0 35px;

      display: grid;
      place-items: center;

      color: var(--accent-light);
      background: rgba(232, 169, 187, 0.08);
      border: 1px solid rgba(232, 169, 187, 0.12);
      border-radius: 12px;

      font-size: 0.84rem;
      font-weight: 750;
      letter-spacing: -0.03em;
    }

    .arrow {
      color: var(--text-muted);
      font-size: 1.2rem;
      transition: transform 180ms ease;
    }

    .social-link:hover .arrow {
      transform: translateX(3px);
    }

    .adult-link {
      background:
        linear-gradient(
          135deg,
          rgba(91, 31, 49, 0.72),
          rgba(38, 23, 32, 0.94)
        );

      border-color: rgba(220, 129, 154, 0.3);
    }

    .adult-text {
      display: flex;
      flex-direction: column;
    }

    .adult-label {
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 500;
    }

    footer {
      margin-top: 23px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    @media (min-width: 700px) {
      body {
        padding: 40px 20px;
      }

      .profile-card {
        padding: 42px 32px 28px;
      }
    }

    /* Отключает анимации для пользователей,
       выбравших уменьшение движения в системе */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="profile-card" aria-labelledby="profile-name">
      <header class="profile-header">

        <div class="avatar-ring">
          <!--
            ФОТОГРАФИЯ ПРОФИЛЯ

            Сейчас здесь встроена временная картинка с буквой L.

            Позже, когда загрузишь файл avatar.jpg,
            замени всё значение src на:

            src="avatar.jpg"
          -->
          <img
            class="avatar"
            src="avatar.jpeg"
            width="400"
            height="400"
          >
        </div>

        <h1 id="profile-name">
          Lumi<span class="rose" aria-hidden="true">.</span>
        </h1>

        <p class="description">
          Outfits, Musik &amp; kleine Alltagsmomente ✨
        </p>

        <span class="username">
          @lumi.blackrose
        </span>
      </header>

      <nav class="links" aria-label="Lumis soziale Links">

        <!--
          TIKTOK:
          Замени https://example.com/tiktok
          на настоящую полную ссылку TikTok.
        -->
        <a
          class="social-link"
          href="https://www.tiktok.com/@lumi.blackrose"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Lumi auf TikTok öffnen"
        >
          <span class="link-content">
            <span class="icon" aria-hidden="true">TT</span>
            <span>TikTok</span>
          </span>

          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <!--
          INSTAGRAM:
          Замени https://example.com/instagram
          на настоящую полную ссылку Instagram.
        -->
        <a
          class="social-link"
          href="https://www.instagram.com/lumissl1"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Lumi auf Instagram öffnen"
        >
          <span class="link-content">
            <span class="icon" aria-hidden="true">IG</span>
            <span>Instagram</span>
          </span>

          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <!--
          THREADS:
          Замени https://example.com/threads
          на настоящую полную ссылку Threads.
        -->
        <a
          class="social-link"
          href="https://www.threads.com/@lumissl1"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Lumi auf Threads öffnen"
        >
          <span class="link-content">
            <span class="icon" aria-hidden="true">TH</span>
            <span>Threads</span>
          </span>

          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <!--
          STACKED, ТОЛЬКО 18+:
          Замени https://example.com/stacked
          на настоящую полную ссылку своей страницы Stacked.
        -->
        <a
          class="social-link adult-link"
          href="https://www.stacked.com/@lumivane/membership"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Mehr von Lumi öffnen, nur für Erwachsene ab 18 Jahren"
        >
          <span class="link-content">
            <span class="icon" aria-hidden="true">18+</span>

            <span class="adult-text">
              <span>Mehr von mir — 18+</span>
              <span class="adult-label">
                Nur für Erwachsene
              </span>
            </span>
          </span>

          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </nav>

      <footer>
        © Lumi
      </footer>
    </section>
  </main>
</body>
</html>
